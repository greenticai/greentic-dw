bench = [
    { name = "perf", harness = false },
]

[workspace]
members = [
    ".",
    "crates/greentic-dw-context",
    "crates/greentic-dw-types",
    "crates/greentic-dw-manifest",
    "crates/greentic-dw-core",
    "crates/greentic-dw-delegation",
    "crates/greentic-dw-runtime",
    "crates/greentic-dw-engine",
    "crates/greentic-dw-pack",
    "crates/greentic-dw-planning",
    "crates/greentic-dw-planning-llm",
    "crates/greentic-dw-reflection",
    "crates/greentic-dw-reflection-llm",
    "crates/greentic-dw-delegation-llm",
    "crates/greentic-dw-testing",
    "crates/greentic-dw-workspace",
    "crates/greentic-dw-workspace-mem",
    "crates/greentic-dw-pack-builder",
    "crates/greentic-dw-operala-bridge",
    "crates/greentic-dw-context-llm",
    "crates/greentic-dw-operala-invoker",
]
resolver = "2"
# greentic-dw-cli depends on greentic-dw-authoring by git, and dw-authoring
# depends back on greentic-dw (through greentic-runner) on the research lane.
# Research-lane crates cannot share a graph with the 1.2.0-dev crates.io lane,
# so the CLI (and the `greentic-dw` binary it now owns) sits outside the
# workspace until greentic-dw-authoring is published on the 1.2.0-dev lane.
# It rejoins `members` then.
exclude = [
    "crates/greentic-dw-cli",
]

[workspace.package]
version = "1.2.0-dev.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/greenticai/greentic-dw"

[workspace.dependencies]
criterion = "0.8"
greentic-extension-sdk-contract = ">=1.2.24-dev, <1.2.25"
greentic-llm = ">=1.2.0-dev, <1.3.0-0"
serde_cbor = "0.11"
serde_json = "1"
tempfile = "3"
thiserror = "2"

[workspace.dependencies.clap]
version = "4"
features = [
    "derive",
]

[workspace.dependencies.greentic-dw-context]
path = "crates/greentic-dw-context"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-core]
path = "crates/greentic-dw-core"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-delegation]
path = "crates/greentic-dw-delegation"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-engine]
path = "crates/greentic-dw-engine"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-manifest]
path = "crates/greentic-dw-manifest"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-pack]
path = "crates/greentic-dw-pack"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-planning]
path = "crates/greentic-dw-planning"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-reflection]
path = "crates/greentic-dw-reflection"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-runtime]
path = "crates/greentic-dw-runtime"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-testing]
path = "crates/greentic-dw-testing"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-types]
path = "crates/greentic-dw-types"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-workspace]
path = "crates/greentic-dw-workspace"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-context-llm]
path = "crates/greentic-dw-context-llm"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-delegation-llm]
path = "crates/greentic-dw-delegation-llm"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-planning-llm]
path = "crates/greentic-dw-planning-llm"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-reflection-llm]
path = "crates/greentic-dw-reflection-llm"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-operala-bridge]
path = "crates/greentic-dw-operala-bridge"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-operala-invoker]
path = "crates/greentic-dw-operala-invoker"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-workspace-mem]
path = "crates/greentic-dw-workspace-mem"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-dw-pack-builder]
path = "crates/greentic-dw-pack-builder"
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-cap-core]
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-cap-profile]
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-cap-resolver]
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-cap-schema]
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.greentic-cap-types]
version = ">=1.2.0-dev, <1.3.0-0"

[workspace.dependencies.schemars]
version = "1"
features = [
    "derive",
]

[workspace.dependencies.serde]
version = "1"
features = [
    "derive",
]

[workspace.dependencies.ureq]
version = "3"
default-features = false

[package]
name = "greentic-dw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Greentic data workspace command-line entrypoint."
readme = "README.md"
repository = "https://github.com/greenticai/greentic-dw"
homepage = "https://github.com/greenticai/greentic-dw"
documentation = "https://docs.rs/greentic-dw"
keywords = [
    "greentic",
    "data",
    "workspace",
]
categories = [
    "command-line-utilities",
]
include = [
    "src/**",
    "crates/**",
    "tools/**",
    "ci/**",
    ".github/workflows/**",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dev-dependencies.criterion]
workspace = true

[dev-dependencies.greentic-cap-types]
workspace = true

[dev-dependencies.greentic-dw-core]
workspace = true

[dev-dependencies.greentic-dw-engine]
workspace = true

[dev-dependencies.greentic-dw-manifest]
workspace = true

[dev-dependencies.greentic-dw-runtime]
workspace = true

[dev-dependencies.greentic-dw-types]
workspace = true
